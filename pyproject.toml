[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "job-applicator"
version = "0.1.0"
description = "Job Applicator"
readme = "README.md"
authors = [
  {name = "Bogdan Pavliuk", email = "bopvlk@gmail.comm"}
]
maintainers = [
  {name = "Bogdan Pavliuk", email = "bopvlk@gmail.comm"}
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
license = {text = "MIT"}
dependencies = [
  "typer",
  "rich",
  "aiogram",
  "pydantic-settings[yaml]",
  "sqlmodel",
  "sqlalchemy-cockroachdb>=2.0.4",
  "psycopg2-binary>=2.9.12",
  "aiosmtplib>=5.1.2",
  "qdrant-client>=1.19.0",
  "google-genai>=2.20.0",
  "tavily-python>=0.8.0",
  "langchain-google-genai>=4.3.7",
  "langchain-community>=0.4.2",
  "apscheduler>=3.11.3",
]
requires-python = ">= 3.12"

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "typecheck" },
]
lint = [
    "ruff",
]
test = [
    "coverage",
    "pytest",
]
typecheck = [
    "ty",
]
docs = [
    "zensical",
    "mkdocstrings-python",
]

[project.urls]
bugs = "https://github.com/boplk/job-applicator/issues"
changelog = "https://github.com/boplk/job-applicator/releases"
documentation = "https://boplk.github.io/job-applicator/"
homepage = "https://github.com/boplk/job-applicator"

[project.scripts]
job_applicator = "job_applicator.cli:app"

[tool.ty]
# All rules are enabled as "error" by default; no need to specify unless overriding.
# Example override: relax a rule for the entire project (uncomment if needed).
# rules.TY015 = "warn"  # For invalid-argument-type, warn instead of error.

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.coverage.run]
branch = true
parallel = true
source = ["src/", "tests/"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 50
exclude_also = [
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@overload",
    "@typing.overload",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = true
default-groups = ["dev"]
